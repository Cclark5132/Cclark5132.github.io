name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            booster-prep/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Booster Prep: a private study site served at /booster-prep/, encrypted behind a password.
      # public/booster-prep/index.html (already copied into dist by the build above) is a committed,
      # encrypted copy. When the BOOSTER_PREP_PASSWORD secret is set, it is rebuilt from source and
      # re-encrypted with that password instead.
      - name: Install Booster Prep dependencies
        run: pnpm --dir booster-prep install --frozen-lockfile

      - name: Test and lint Booster Prep
        run: |
          pnpm --dir booster-prep test
          pnpm --dir booster-prep lint

      - name: Build and encrypt Booster Prep
        env:
          BOOSTER_PREP_PASSWORD: ${{ secrets.BOOSTER_PREP_PASSWORD }}
        run: |
          if [ -n "$BOOSTER_PREP_PASSWORD" ]; then
            pnpm --dir booster-prep build
            node booster-prep/scripts/encrypt.mjs dist/booster-prep/index.html
          else
            echo "::notice::BOOSTER_PREP_PASSWORD is not set; deploying the committed encrypted page."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
