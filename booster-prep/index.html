<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>Booster Prep</title>
    <link rel="icon" href="data:," />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem("booster-prep:theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
      // If the app fails before it can draw anything, show the error instead of a blank page.
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        root.style.cssText = "padding:24px;font:15px/1.5 system-ui,sans-serif;color:#e7ecf3;background:#0a1120;min-height:100vh";
        var where = (event.filename || "") + ":" + event.lineno + ":" + event.colno;
        var stack = event.error && event.error.stack ? String(event.error.stack).slice(0, 600) : "";
        root.textContent = "Booster Prep couldn't start in this browser. Try reloading, or send Claude this message: " + event.message + " @ " + where + " | " + stack + " | " + navigator.userAgent;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
